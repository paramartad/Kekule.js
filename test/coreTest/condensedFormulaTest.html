<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Condensed Formula Test</title>
    <script src="../../src/kekule.js?min=false&modules=render,chemWidget"></script>
</head>
<body>
    <section>
        <input id="inputBondOrder" type="number" placeholder="incoming bond order" style="min-width: 10em"/>
        <br />
        <input id="inputFormula" type="text" placeholder="formula" style="min-width: 40em"/>
        <button id="btnExec">Execute</button>
        <button id="btnExecDirect">Execute Direct</button>
    </section>
    <section>
        <p>[<span id="labelType"></span>]</p>
        <p id="labelSmiles"></p>
        <p id="labelFormula"></p>
        <p id="labelRichText"></p>
    </section>
    <script>
        function execute()
        {
            document.getElementById('labelSmiles').innerHtml = '';
            document.getElementById('labelFormula').innerHTML = '';
            document.getElementById('labelRichText').innerHTML = '';

            var incomingBondOrder = parseInt(document.getElementById('inputBondOrder').value);
            var formulaText = document.getElementById('inputFormula').value;
            var analyzer = new Kekule.CondensedFormulaTextAnalyzer(formulaText);
            analyzer.setSubgroupItems(Kekule.Editor.RepositoryData.subGroups);
            var tokenTree = analyzer.getPossibleTokenInfoTree();
            console.log(tokenTree);

            var subgroupInfoMap = new Kekule.MapEx();
            Kekule.CondensedFormulaUtils._fillFullPathTokenListsAndHandle(tokenTree, [], (tokenList) => {
                try {
                    var structUnitList = Kekule.CondensedFormulaUtils._convertTokenListToStructureUnitList(tokenList, {});
                }
                catch(e)
                {
                    console.error(e);
                }
                console.log(structUnitList);
                if (structUnitList && structUnitList.length)
                {
                    try {
                        var mol = Kekule.CondensedFormulaUtils._createStructureFragFromUnitListEx(structUnitList, 1, incomingBondOrder, {enableExplicitHydrogen: !true, ignoreAtomValence: !true}, subgroupInfoMap)?.frag;
                        console.log(mol);
                        if (mol) {
                            var smiles = Kekule.IO.saveFormatData(mol, Kekule.IO.DataFormat.SMILES);
                            document.getElementById('labelSmiles').innerHtml += `<div>${smiles}</div>`;
                            console.log(smiles);

                            var formula = Kekule.CondensedFormulaUtils._createFormulaFromUnitList(structUnitList, {});
                            if (formula) {
                                console.log(Kekule.FormulaUtils.formulaToText(formula), formula);
                                var rt = Kekule.Render.ChemDisplayTextUtils.formulaToRichText(formula, true);
                                var rtHtml = Kekule.Render.RichTextUtils.toSimpleHtmlCode(rt);
                                document.getElementById('labelFormula').innerHTML += `<div>${rtHtml}</div>`;
                            }
                            //return {success: true};
                        }
                    } catch(e) {
                        console.error(e);
                    }
                }
            });
        }

        function executeDirect()
        {
            var incomingBondOrder = parseInt(document.getElementById('inputBondOrder').value);
            var formulaText = document.getElementById('inputFormula').value;

            var guessedType = Kekule.CondensedFormulaUtils.guessFormulaTextType(formulaText);
            document.getElementById('labelType').innerText = guessedType;

            var result = Kekule.CondensedFormulaUtils.parse(formulaText, incomingBondOrder, Kekule.Editor.RepositoryData.subGroups, {structure: true, structureUnits: true, formula: true, richText: true});
            var mol = result.structure;
            var formula = result.formula;
            console.log(mol);
            console.log(result.structureUnits);
            console.log(result.richText);
            if (mol) {
                var smiles = Kekule.IO.saveFormatData(mol, Kekule.IO.DataFormat.SMILES);
                document.getElementById('labelSmiles').innerText = smiles;
                console.log(smiles);
                //return {success: true};
            }
            else
                document.getElementById('labelSmiles').innerText = '';
            if (formula)
            {
                console.log(Kekule.FormulaUtils.formulaToText(formula), formula);
                var rt = Kekule.Render.ChemDisplayTextUtils.formulaToRichText(formula, true);
                var rtHtml = Kekule.Render.RichTextUtils.toSimpleHtmlCode(rt);
                document.getElementById('labelFormula').innerHTML = `<div>${rtHtml}</div>`;
            }
            else
                document.getElementById('labelFormula').innerHTML = '';

            if (result.richText)
            {
                var rtHtml = Kekule.Render.RichTextUtils.toSimpleHtmlCode(result.richText);
                document.getElementById('labelRichText').innerHTML = rtHtml;
            }
            else
                document.getElementById('labelRichText').innerHTML = '';

            console.log(result.structureUnits);
        }
        document.getElementById('btnExec').addEventListener('click', execute);
        document.getElementById('btnExecDirect').addEventListener('click', executeDirect);
    </script>
</body>
</html>
