    <script>
        function getEditor() {
            return Kekule.Widget.getWidgetById('composer').getEditor();
        }

        function initChemDocSelector() {
            var elem = document.getElementById('selChemDoc');
            elem.innerHTML = '';
            var docResourceElems = document.querySelectorAll('script[type="chemical/x-kekule-json"]');
            docResourceElems.forEach(resElem => {
                var id = resElem.id;
                var optionElem = document.createElement('option');
                optionElem.setAttribute('value', id);
                optionElem.innerText = id;
                elem.appendChild(optionElem);
            });
            elem.addEventListener('change', e => {
                var id = elem.value;
                var resElem = document.getElementById(id);
                var content = resElem.innerText;
                var chemDoc = Kekule.IO.loadFormatData(content, Kekule.IO.DataFormat.KEKULE_JSON);
                getEditor().load(chemDoc);
            });
        }

        const defUseSmiles = !true;

        function molToString(mol, useMolSmiles = defUseSmiles) {
            var result;
            if (mol instanceof Kekule.ImplicitReactionIntermediate)
                result = '*' + mol.getId();  // + Kekule.IO.saveFormatData(mol, Kekule.IO.DataFormat.SMILES);
            else {
                if (useMolSmiles) {
                    if (mol.hasCtab())
                        result = Kekule.IO.saveFormatData(mol, Kekule.IO.DataFormat.SMILES);
                    else if (mol.hasFormula())
                        result = mol.getFormula().getText();
                }

                if (!result)  // use id
                    result = mol.getId();
            }

            return result;
        }
        function reactionToString(reaction, useMolSmiles = defUseSmiles) {
            var reactants = reaction?.getExplicitReactants?.() || reaction.getReactants();
            var reagents = reaction.getReagents();
            var products = reaction.getProducts();
            var conditions = reaction.getConditionComponents().map(comp => reaction.getCondition(comp));
            var parts = [];
            if (reactants?.length)
                parts.push(reactants.map(mol => molToString(mol, useMolSmiles)).join(' . '));
            if (reagents?.length)
                parts.push('{ ' + reagents.map(mol => molToString(mol, useMolSmiles)).join(' . ') + ' }');
            if (conditions?.length)
                parts.push('(' + conditions.join('/') + ')');
            parts.push('->');
            if (products?.length)
                parts.push(products.map(mol => molToString(mol, useMolSmiles)).join(' . '));
            return parts.join(' ');
        }
        function reactionChainToString(reactionChain, useMolSmiles = defUseSmiles) {
            var result = [];
            var reactionSteps = reactionChain.getReactions();
            reactionSteps.forEach((step, index) => {
                result.push(reactionToString(step, useMolSmiles));
            });
            return result.join(' ');
        }

        function exportSingleReaction() {
            var chemDoc = getEditor().getChemSpace();
            var reaction = Kekule.ReactionExtractionUtils.extractReactionFromChemDocument(chemDoc);
            var elem = document.getElementById('outputSingleReaction');
            elem.innerHTML = reaction? reactionToString(reaction): '';
        }

        function execute() {
            exportSingleReaction();
            exportReactionChains(document.getElementById('outputChains'), {insertImplicitIntermediate: true});
            exportReactionChains(document.getElementById('outputChainsUnmerged'), {disableSiblingMerging: true, insertImplicitIntermediate: true});
        }

        Kekule.X.domReady(() => {
            initChemDocSelector();
        });
