    <script>
        function getEditor() {
            return Kekule.Widget.getWidgetById('composer').getEditor();
        }
        function exportReaction() {
            var chemDoc = getEditor().getChemSpace();
            var reaction = Kekule.ReactionExtractionUtils.extractReactionFromChemDocument(chemDoc);
            if (reaction) {
                console.log('Reaction: ', reaction.getReactantCount(), reaction.getProductCount());
                var reactantSmiles = reaction.getReactants().map(mol => Kekule.IO.saveFormatData(mol, Kekule.IO.DataFormat.SMILES) || `[${mol.id}]`);
                var productSmiles = reaction.getProducts().map(mol => Kekule.IO.saveFormatData(mol, Kekule.IO.DataFormat.SMILES) || `[${mol.id}]`);
                var reagentSmiles = reaction.getReagents().map(mol => Kekule.IO.saveFormatData(mol, Kekule.IO.DataFormat.SMILES) || `[${mol.id}]`);
                var conditionComponents = reaction.getConditionComponents();
                var conditionTexts = conditionComponents.map(comp => {
                    var condition = reaction.getCondition(comp);
                    console.log(comp, condition);
                    return condition;
                });

                document.getElementById('labelReactantSmiles').innerText = reactantSmiles.join(' . ');
                document.getElementById('labelProductSmiles').innerText = productSmiles.join(' . ');
                document.getElementById('labelReagentSmiles').innerText = reagentSmiles.join(' . ');
                document.getElementById('labelConditions').innerText = conditionTexts.join(' / ');
            } else {
                console.log('No reaction');
                document.getElementById('labelReactantSmiles').innerText = '';
                document.getElementById('labelProductSmiles').innerText = '';
                document.getElementById('labelReagentSmiles').innerText = '';
                document.getElementById('labelConditions').innerText = '';
            }
        }
    </script>
</head>

        <p>Reactant: <span id="labelReactantSmiles"></span></p>
        <p>Product: <span id="labelProductSmiles"></span></p>
        <p>Reagent: <span id="labelReagentSmiles"></span></p>

</body>
